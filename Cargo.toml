[package]
name = "maca"
version = "0.1.0"
edition = "2024"
description = "Cross-platform package manager for macOS and Linux with native Homebrew and winget catalog APIs plus a custom registry backend"
license = "MIT"
rust-version = "1.85"
homepage = "https://github.com/donaldfilimon/maca"
repository = "https://github.com/donaldfilimon/maca"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tar = "0.4"
flate2 = { version = "1", features = ["rust_backend"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
