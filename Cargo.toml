[package]
name = "maca"
version = "0.1.0-alpha.2"
edition = "2024"
description = "Cross-platform package manager for macOS and Linux. Installs from Homebrew (bottles or source), winget, GitHub Releases, Aqua registry, and custom sources — without shelling out to the native tools."
license = "Apache-2.0"
rust-version = "1.89"
repository = "https://github.com/donaldfilimon/maca"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
crossterm = "0.28"
directories = "6"
flate2 = { version = "1", features = ["rust_backend"] }
hex = "0.4"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
