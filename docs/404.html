<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>404 • maca</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        />
        <style>
            body {
                font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI',
                    Roboto, sans-serif;
            }
        </style>
    </head>
    <body
        class="bg-slate-950 text-slate-200 flex items-center justify-center min-h-screen"
    >
        <div class="text-center px-6">
            <div
                class="mx-auto w-16 h-16 bg-gradient-to-br from-slate-400 to-slate-600 rounded-2xl flex items-center justify-center mb-6"
            >
                <span class="text-slate-950 font-bold text-3xl">m</span>
            </div>
            <h1 class="text-6xl font-semibold tracking-tighter">404</h1>
            <p class="mt-3 text-2xl text-slate-400">Page not found</p>
            <p class="mt-2 text-slate-500 max-w-xs mx-auto">
                The page you're looking for doesn't exist or was moved.
            </p>

            <div class="mt-8">
                <a
                    href="./"
                    class="inline-flex items-center gap-x-2 px-6 py-3 rounded-2xl bg-white text-slate-900 font-semibold hover:bg-slate-100 transition"
                >
                    <i class="fa-solid fa-arrow-left mr-2"></i>
                    Back to home
                </a>
            </div>

            <div class="mt-10 text-xs text-slate-600">
                <a
                    href="https://github.com/donaldfilimon/maca"
                    class="hover:text-slate-400"
                    >GitHub → donaldfilimon/maca</a
            </div>
        </div>
    </body>
</html>
